{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GAMESENSE</title>
    <style>
        /* Цвета GameSense */
        :root {
            --bg-body: #0c0c0c;
            --bg-panel: #141414;
            --accent: #a5e12d;
            --border: #222222;
            --text: #d1d1d1;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text);
            font-family: 'Tahoma', sans-serif;
            font-size: 11px;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* Главный контейнер */
        .wrapper {
            width: 100%;
            max-width: 600px;
        }

        /* Шапка */
        .header {
            color: var(--accent);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Кнопка */
        .gs-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 3px 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 10px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        /* Список задач */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Сама карточка задачи */
        .task-item {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-left: 2px solid var(--accent);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-info b {
            color: #fff;
            display: block;
            margin-bottom: 2px;
        }

        .task-meta {
            color: #777;
            font-size: 10px;
        }

        .task-meta span {
            color: var(--accent);
        }

        .btn-edit {
            color: #555;
            text-decoration: none;
            border: 1px solid #333;
            padding: 2px 5px;
        }

        .btn-edit:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <span>GAMESENSE / TASKS</span>
        </div>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
