{% extends 'base.html' %}

{% block content %}
<div class="forum-category" style="max-width: 450px; margin: 50px auto;">
    <div class="forum-header">REGISTRATION / РЕЄСТРАЦІЯ</div>
    <div class="forum-content" style="background: #141414; padding: 25px;">

        <!-- Ошибки инвайта или пароля -->
        {% if form.errors or error %}
            <div style="color: #ff4444; font-size: 10px; margin-bottom: 15px; border: 1px solid #411; padding: 8px; background: #211; line-height: 1.4;">
                {% if error %}{{ error }}<br>{% endif %}
                {% for field in form %}{% for err in field.errors %}{{ err }}<br>{% endfor %}{% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <!-- Поле Юзернейм -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; color: #666; font-size: 10px; text-transform: uppercase; margin-bottom: 5px;">Username</label>
                <input type="text" name="username" required style="width: 100%; background: #0c0c0c; border: 1px solid #222; color: #fff; padding: 8px; outline: none; box-sizing: border-box; font-size: 12px;">
            </div>

            <!-- Поле Пароль -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; color: #666; font-size: 10px; text-transform: uppercase; margin-bottom: 5px;">Password</label>
                <input type="password" name="password" required style="width: 100%; background: #0c0c0c; border: 1px solid #222; color: #fff; padding: 8px; outline: none; box-sizing: border-box;">
            </div>

            <!-- Подтверждение пароля -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; color: #666; font-size: 10px; text-transform: uppercase; margin-bottom: 5px;">Confirm Password</label>
                <input type="password" name="password_confirm" required style="width: 100%; background: #0c0c0c; border: 1px solid #222; color: #fff; padding: 8px; outline: none; box-sizing: border-box;">
            </div>

            <!-- ИНВАЙТ-КОД -->
            <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #222;">
                <label style="display: block; color: var(--accent); font-size: 10px; margin-bottom: 5px; text-transform: uppercase; font-weight: bold;">Invite Code</label>
                <input type="text" name="invite_code" required style="width: 100%; background: #0c0c0c; border: 1px solid var(--accent); color: #fff; padding: 8px; outline: none; box-sizing: border-box;" placeholder="Enter code...">
            </div>

            <button type="submit" class="action-btn" style="background: var(--accent); color: #000; width: 100%; padding: 10px; font-weight: bold; border: none; margin-top: 20px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;">
                Create Account
            </button>
        </form>
    </div>
</div>
{% endblock %}
