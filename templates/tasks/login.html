{% extends 'base.html' %}

{% block content %}
<div class="forum-category" style="max-width: 400px; margin: 50px auto;">
    <div class="forum-header">LOGIN / ВХІД</div>
    <div class="forum-content" style="background: #141414; padding: 25px;">
        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom: 15px;">
                {{ form.as_p }}
            </div>
            <button type="submit" class="action-btn" style="background: var(--accent); color: #000; width: 100%; padding: 8px; font-weight: bold; border: none;">SIGN IN</button>
        </form>
        <div style="margin-top: 15px; text-align: center; font-size: 10px;">
            <a href="{% url 'tasks:register' %}" style="color: #666;">Don't have an account? Register</a>
        </div>
    </div>
</div>
{% endblock %}
